    .hd  { fill: #00FF41; font: bold 13px 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; letter-spacing: 1px; }
  </style>
  <rect class="bg" width="460" height="206" rx="6"/>
  <text x="20" y="30" class="hd">TOP LANGUAGES</text>
  <text x="20" y="60" class="lbl" fill="#00FF41">HTML</text>
  <rect x="150" y="49" width="250" height="10" fill="#1a2b1a" rx="2"/>
  <rect x="150" y="49" width="188.5" height="10" fill="#00FF41" rx="2"/>
  <text x="410" y="60" class="lbl">75.4%</text>
  <text x="455" y="60" class="lbl" fill="#3fae55">6 repos</text>
  <text x="20" y="86" class="lbl" fill="#00FF41">TypeScript</text>
  <rect x="150" y="75" width="250" height="10" fill="#1a2b1a" rx="2"/>
  <rect x="150" y="75" width="25.8" height="10" fill="#00FF41" rx="2"/>
  <text x="410" y="86" class="lbl">10.3%</text>
  <text x="455" y="86" class="lbl" fill="#3fae55">3 repos</text>
  <text x="20" y="112" class="lbl" fill="#00FF41">Shell</text>
  <rect x="150" y="101" width="250" height="10" fill="#1a2b1a" rx="2"/>
  <rect x="150" y="101" width="13.2" height="10" fill="#00FF41" rx="2"/>
  <text x="410" y="112" class="lbl">5.3%</text>
  <text x="455" y="112" class="lbl" fill="#3fae55">3 repos</text>
  <text x="20" y="138" class="lbl" fill="#00FF41">CSS</text>
  <rect x="150" y="127" width="250" height="10" fill="#1a2b1a" rx="2"/>
  <rect x="150" y="127" width="12.4" height="10" fill="#00FF41" rx="2"/>
