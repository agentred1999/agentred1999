  <text x="410" y="164" class="lbl">3.2%</text>
  <text x="455" y="164" class="lbl" fill="#3fae55">6 repos</text>
  <text x="20" y="190" class="lbl" fill="#00FF41">Python</text>
  <rect x="150" y="179" width="250" height="10" fill="#1a2b1a" rx="2"/>
