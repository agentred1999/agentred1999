<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 8 664 632" width="664" height="632" font-family="'JetBrains Mono', 'Courier New', Consolas, monospace">
  <defs>
    <linearGradient id="beige" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9d2c0"/>
      <stop offset="100%" stop-color="#bdb39c"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1f0f"/>
      <stop offset="100%" stop-color="#03130a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Typewriter clip rects: width grows over time to reveal each line character by character -->
    <!-- Timings slowed ~1.6x from the original for a more relaxed typing feel -->
    <clipPath id="clipL1">
      <rect x="98" y="114" width="0" height="20">
        <animate attributeName="width" from="0" to="212" begin="0.5s" dur="1.6s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clipL2">
      <rect x="98" y="139" width="0" height="20">
        <animate attributeName="width" from="0" to="237" begin="2.4s" dur="1.8s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clipL3">
      <rect x="98" y="162" width="0" height="20">
        <animate attributeName="width" from="0" to="246" begin="4.5s" dur="1.8s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="clipR1">
      <rect x="98" y="204" width="0" height="20">
        <animate attributeName="width" from="0" to="212" begin="9.6s" dur="1.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clipR2">
      <rect x="98" y="229" width="0" height="20">
        <animate attributeName="width" from="0" to="237" begin="11.2s" dur="1.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clipR3">
      <rect x="98" y="254" width="0" height="20">
        <animate attributeName="width" from="0" to="160" begin="12.8s" dur="1.1s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clipR4">
      <rect x="98" y="279" width="0" height="20">
        <animate attributeName="width" from="0" to="186" begin="14.1s" dur="1.3s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Monitor shell -->
  <rect x="30" y="20" width="640" height="600" rx="18" fill="url(#beige)" stroke="#8f8567" stroke-width="2"/>

  <!-- Vent slits top -->
  <g stroke="#8f8567" stroke-width="2">
    <line x1="520" y1="35" x2="520" y2="65"/>
    <line x1="535" y1="35" x2="535" y2="65"/>
    <line x1="550" y1="35" x2="550" y2="65"/>
    <line x1="565" y1="35" x2="565" y2="65"/>
    <line x1="580" y1="35" x2="580" y2="65"/>
  </g>

  <!-- IBM badge -->
  <text x="55" y="55" font-size="16" font-weight="bold" fill="#3a3527">IBM</text>

  <!-- Screen bezel (4:3 ratio) -->
  <rect x="65" y="80" width="570" height="428" rx="6" fill="#0d0d0d"/>
  <!-- Screen (true 4:3) -->
  <rect x="80" y="95" width="540" height="405" rx="3" fill="url(#screenGlow)"/>

  <!-- Divider between terminal text and portrait -->
  <line x1="450" y1="95" x2="450" y2="500" stroke="#0f3d20" stroke-width="1"/>

  <!-- ===== Intro lines, typed character by character ===== -->
  <g fill="#39d353" filter="url(#glow)" font-size="14">
    <text x="100" y="130" clip-path="url(#clipL1)">Wake up, agentred1999...</text>
    <text x="100" y="155" clip-path="url(#clipL2)">&gt; Follow the white rabbit.</text>
    <text x="100" y="178" clip-path="url(#clipL3)">&gt; Knock Knock agentred1999.</text>
  </g>

  <!-- Blinking cursor: tracks the end of whichever line is currently being typed.
       It sits at the start of a line while that line types out, jumps to the end
       of the line the instant typing finishes, holds there through any pause,
       then jumps to the next line's start as soon as that line begins. It blinks
       continuously the whole time and rests at the end of the final line. -->
  <rect x="100" y="119" width="8" height="14" fill="#39d353">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="x"
      keyTimes="0;0.0325;0.1364;0.1558;0.2727;0.2922;0.4091;0.6234;0.7143;0.7273;0.8182;0.8312;0.9026;0.9156;1.0;1"
      values="100;100;312;100;337;100;346;100;312;100;337;100;260;100;286;286"
      begin="0s" dur="15.4s" fill="freeze"/>
    <animate attributeName="y"
      keyTimes="0;0.0325;0.1364;0.1558;0.2727;0.2922;0.4091;0.6234;0.7143;0.7273;0.8182;0.8312;0.9026;0.9156;1.0;1"
      values="119;119;119;144;144;167;167;209;209;234;234;259;259;284;284;284"
      begin="0s" dur="15.4s" fill="freeze"/>
  </rect>

  <!-- ===== Reveal lines, typed character by character underneath ===== -->
  <g fill="#39d353" filter="url(#glow)" font-size="14">
    <text x="100" y="220" clip-path="url(#clipR1)">My name is Richard Dean.</text>
    <text x="100" y="245" clip-path="url(#clipR2)">I am a software developer.</text>
    <text x="100" y="270" clip-path="url(#clipR3)">I build websites.</text>
    <text x="100" y="295" clip-path="url(#clipR4)">Welcome to my GitHub.</text>
  </g>


  <!-- ASCII portrait panel -->
  <rect x="470" y="130" width="130" height="22" fill="none" stroke="#1f7a3d" stroke-width="1"/>
  <text x="480" y="145" fill="#2ea84a" font-size="10">[ ascii portrait ]</text>

  <g fill="#2ea84a" font-size="10" font-family="'Courier New', monospace">
    <text x="480" y="175">   .--.</text>
    <text x="480" y="190">  ( o o )</text>
    <text x="480" y="205">  | -- |</text>
    <text x="480" y="220">  '----'</text>
    <text x="480" y="235">  |####|</text>
    <text x="480" y="250">  |####|</text>
  </g>
  <rect x="470" y="262" width="120" height="24" fill="none" stroke="#1f7a3d" stroke-width="1"/>
  <text x="482" y="278" fill="#2ea84a" font-size="10">PC/AT 5170</text>

  <!-- Lower shell / control panel -->
  <rect x="30" y="520" width="640" height="60" rx="8" fill="url(#beige)" stroke="#8f8567" stroke-width="2"/>
  <circle cx="80" cy="550" r="10" fill="#c98a2b" stroke="#7a5518" stroke-width="1.5"/>
  <rect x="180" y="542" width="280" height="16" rx="2" fill="#3a3527"/>
  <text x="530" y="555" font-size="13" fill="#5a5340">PC/AT 5170</text>

  <!-- Neck -->
  <rect x="290" y="580" width="120" height="30" fill="#bdb39c" stroke="#8f8567" stroke-width="2"/>
  <!-- Base -->
  <rect x="210" y="610" width="280" height="18" rx="9" fill="#bdb39c" stroke="#8f8567" stroke-width="2"/>
</svg>
