<svg width="460" height="140" viewBox="0 0 460 140"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub contribution streaks">
  <title>GitHub contribution streaks</title>
  <style>
    .bg  { fill: #0d1117; }
    .lbl { fill: #3fae55; font: 12px 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .val { fill: #00FF41; font: bold 15px 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .hd  { fill: #00FF41; font: bold 13px 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; letter-spacing: 1px; }
  </style>
  <rect class="bg" width="460" height="140" rx="6"/>
  <text x="20" y="30" class="hd">STREAK</text>

  <text x="20" y="65" class="val" font-size="28">0</text>
  <text x="90" y="60" class="lbl">day current streak</text>
  <text x="90" y="76" class="lbl" fill="#12a83a">Aug 27, 2026 → Aug 27, 2026</text>

  <line x1="20" y1="92" x2="440" y2="92" stroke="#1a2b1a"/>

  <text x="20" y="120" class="val" font-size="28">4</text>
  <text x="90" y="115" class="lbl">day longest streak</text>
  <text x="90" y="131" class="lbl" fill="#12a83a">Jul 28, 2026 → Jul 31, 2026</text>

</svg>